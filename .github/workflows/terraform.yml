name: 'Terraform Infrastructure'

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (dev, prod, or main)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
          - budget_bot
  push:
    branches: ['main', 'dev', 'production', 'budget_bot']
  pull_request:
    branches: ['main']

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  terraform:
    name: 'Terraform Plan and Apply'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    defaults:
      run:
        shell: bash # Sử dụng bash shell để chạy các lệnh Terraform

    steps:
      # 1. Checkout code from the repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Determine which environment to deploy
      - name: Determine Environment
        id: environment
        run: |
          if [ "${{ github.ref }}" == "refs/heads/dev" ]; then
            echo "env_path=environments/dev" >> $GITHUB_OUTPUT
            echo "env_name=dev" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/production" ]; then
            echo "env_path=environments/prod" >> $GITHUB_OUTPUT
            echo "env_name=prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/budget_bot" ]; then
            echo "env_path=environments/budget_bot" >> $GITHUB_OUTPUT
            echo "env_name=budget_bot" >> $GITHUB_OUTPUT
          else
            echo "env_path=environments/dev" >> $GITHUB_OUTPUT
            echo "env_name=main" >> $GITHUB_OUTPUT
          fi

      # 3. Configure AWS Credentials using the role ARN stored in GitHub Secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }} # Secret đã tạo ở GitHub
          aws-region: us-east-1

      # 4. Setup Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # 4.5. Bootstrap S3 Backend Bucket (Giải quyết bài toán con gà quả trứng)
      - name: Ensure S3 Backend Bucket Exists
        run: |
          BUCKET_NAME="budgetbot-tfstate-hackathon-w7"
          TABLE_NAME="budgetbot-terraform-state-lock"
          REGION="us-east-1"
          
          # 1. Tạo S3 bucket nếu chưa có
          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "Bucket $BUCKET_NAME đã tồn tại."
          else
            echo "Bucket $BUCKET_NAME chưa tồn tại. Đang tự động tạo..."
            aws s3api create-bucket --bucket "$BUCKET_NAME" --region "$REGION"
            
            # Bật Versioning
            aws s3api put-bucket-versioning --bucket "$BUCKET_NAME" --versioning-configuration Status=Enabled
            
            # Bật Mã hóa mặc định
            aws s3api put-bucket-encryption --bucket "$BUCKET_NAME" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            
            # Chặn truy cập công khai hoàn toàn
            aws s3api put-public-access-block --bucket "$BUCKET_NAME" \
              --public-access-block-configuration "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
          fi
          
          # 2. Tạo DynamoDB table để khóa file state (chống xung đột)
          if ! aws dynamodb describe-table --table-name "$TABLE_NAME" --region "$REGION" 2>/dev/null; then
            echo "Creating DynamoDB table: $TABLE_NAME"
            aws dynamodb create-table \
              --table-name "$TABLE_NAME" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "$REGION"
            
            # Chờ bảng tạo xong
            aws dynamodb wait table-exists --table-name "$TABLE_NAME" --region "$REGION"
          else
            echo "DynamoDB table $TABLE_NAME đã tồn tại."
          fi

      # 5. Initialize Terraform
      - name: Terraform Init
        run: |
          cd ${{ steps.environment.outputs.env_path }}
          terraform init

      # 6. Format Terraform files
      - name: Terraform Format
        run: |
          cd ${{ steps.environment.outputs.env_path }}
          terraform fmt -check # -check có nghĩa là chỉ kiểm tra định dạng mà không sửa lỗi, nếu có lỗi sẽ làm cho bước này thất bại

      # 7. Validate Terraform configuration
      - name: Terraform Validate
        run: |
          cd ${{ steps.environment.outputs.env_path }}
          terraform validate

      # 8. Plan Terraform changes
      - name: Terraform Plan
        run: |
          cd ${{ steps.environment.outputs.env_path }}
          set +e
          terraform plan -no-color -input=false -out=tfplan 2>plan_stderr.txt
          PLAN_EXIT=$?
          echo ""
          echo "========================================="
          echo "Terraform exit code: $PLAN_EXIT"
          echo "========================================="
          if [ -s plan_stderr.txt ]; then
            echo "=== STDERR OUTPUT ==="
            cat plan_stderr.txt
            echo "=== END STDERR ==="
          fi
          exit $PLAN_EXIT

      # 9. Apply Terraform changes (chỉ khi push vào dev, production hoặc budget_bot)
      - name: Terraform Apply
        if: (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/production' || github.ref == 'refs/heads/budget_bot') && github.event_name == 'push'
        run: |
          cd ${{ steps.environment.outputs.env_path }}
          terraform apply -input=false tfplan # tfplan sẽ áp dụng kế hoạch đã được lưu ở bước plan trước đó
